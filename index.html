<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Sports</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/L4TyB9tJ/star-sports.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { padding: 20px; background-color: #fff; }
        
        .header-title { 
            text-align: center; 
            margin-bottom: 30px; 
            font-size: 1.8rem; 
            font-weight: 800; 
            color: #000; 
            letter-spacing: -0.5px; 
        }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { 
            display: block; 
            background-color: black; 
            border: 2px solid red; 
            border-radius: 10px; 
            padding: 15px; 
            text-decoration: none; 
            color: white; 
            text-align: center;
            transition: .2s; 
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(255,0,0,.2); }
        .card img { height: 80px; max-width: 100%; object-fit: contain; margin-bottom: 10px; }
        .card span { font-size: 15px; font-weight: bold; display: block; }
    </style>
</head>
<body>

    <h1 class="header-title">Star Sports</h1>
    
    <div class="grid">
        <a href="https://joplay.lrl45.workers.dev/1108" target="_blank" class="card"><img src="https://i.postimg.cc/CK7ZrQmL/1.png"><span>Star Sports 1 Hindi HD</span></a>
        <a href="https://joplay.lrl45.workers.dev/1984" target="_blank" class="card"><img src="https://i.postimg.cc/ZRDW4yk3/2.png"><span>Star Sports 2 Hindi HD</span></a>
        <a href="https://joplay.lrl45.workers.dev/110" target="_blank" class="card"><img src="https://i.postimg.cc/J7vsFJcf/3.png"><span>Star Sports 1 HD</span></a>
        <a href="https://joplay.lrl45.workers.dev/1109" target="_blank" class="card"><img src="https://i.postimg.cc/k4D51X2T/4.png"><span>Star Sports 2 HD</span></a>
    </div>

</body>
</html>
